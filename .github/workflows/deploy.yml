# This workflow will build and deploy a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Deploy

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      environment_tag:
        description: 'Enter Tag'     
        required: true
        default: 'v0.0.0'

env:
  ACT: ''

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-project:
    name: Build Project
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version_step.outputs.tag_name }}

    steps:
    - uses: actions/checkout@v7

    - name: Get Version Tag
      id: version_step
      run: |
          set -euo pipefail

          read -r MAJOR MINOR PATCH < <(python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("version.props").getroot(); values = {element.tag.rsplit("}", 1)[-1]: (element.text or "").strip() for element in root.iter()}; print(values["VersionMajor"], values["VersionMinor"], values["VersionPatch"])')
          
          FILE_VERSION="v$MAJOR.$MINOR.$PATCH"
          [[ "$FILE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          
          INPUT_VERSION="${{ github.event.inputs.environment_tag }}"

          if [ -z "$INPUT_VERSION" ] || [[ "$INPUT_VERSION" =~ ^v?0\.0\.0(-test)?$ ]]; then
            FINAL_TAG="$FILE_VERSION"
          else
            FINAL_TAG="$INPUT_VERSION"
          fi

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            BRANCH_SUFFIX="${GITHUB_REF_NAME//\//-}"
            FINAL_TAG="${FINAL_TAG}-${BRANCH_SUFFIX}-${GITHUB_RUN_NUMBER}"
          fi

          echo "tag_name=$FINAL_TAG" >> $GITHUB_OUTPUT

    - name: Checkout and Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - run: dotnet workload install wasm-tools-net8
    - run: dotnet workload install wasm-tools-net9
    - run: dotnet workload install wasm-tools
    - name: Restore dependencies
      run: dotnet restore
    - name: Run Publish Backend
      run: dotnet publish ./Askstatus.Web.API/Askstatus.Web.API.csproj -c Release -o ./dotnet-app/backend --runtime linux-arm64 --self-contained true
    - name: Run Publish Frontend
      run: dotnet publish ./Askstatus.Web.App/Askstatus.Web.App.csproj -c Release -o ./dotnet-app/frontend --runtime browser-wasm --self-contained true
    - name: Upload Artifacts (GitHub)
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: application-artifacts
        path: dotnet-app/

    - name: Upload Artifacts (act)
      if: ${{ env.ACT }}
      uses: actions/upload-artifact@v4
      with:
        name: application-artifacts
        path: dotnet-app/

  release-project:
    name: Release Project
    runs-on: ubuntu-latest
    needs: build-project
    steps:
    - name: Download content (GitHub)
      if: ${{ !env.ACT }}
      uses: actions/download-artifact@v8
      with:
        name: application-artifacts
    - name: Download content (act)
      if: ${{ env.ACT }}
      uses: actions/download-artifact@v4
      with:
        name: application-artifacts
    - name: Archive site content
      run: zip -r release.zip . -x '.git/*'
    - name: Upload Release
      if: ${{ !env.ACT }}
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: "release.zip"
        token: ${{ secrets.GITHUB_TOKEN }}
        commit: ${{ github.sha }}
        tag: "${{ needs.build-project.outputs.tag_name }}"
        name: "Release of Askstatus ${{ needs.build-project.outputs.tag_name }}"
        generateReleaseNotes: true
        makeLatest: ${{ github.ref_name == 'main' }}
    - name: Publish success summary 
      run: echo "Release ${{ needs.build-project.outputs.tag_name }} published successfully!"
